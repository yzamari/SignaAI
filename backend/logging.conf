# Production Logging Configuration for SignaAI Backend
# This file configures structured logging for production deployment

[loggers]
keys=root,signaai,uvicorn,fastapi,sqlalchemy

[handlers]
keys=console,file,gcp

[formatters]
keys=json,standard

# Root logger configuration
[logger_root]
level=INFO
handlers=console,gcp
qualname=root

# SignaAI application logger
[logger_signaai]
level=INFO
handlers=console,file,gcp
qualname=signaai
propagate=0

# Uvicorn server logger
[logger_uvicorn]
level=INFO
handlers=console,gcp
qualname=uvicorn
propagate=0

# FastAPI logger
[logger_fastapi]
level=INFO
handlers=console,gcp
qualname=fastapi
propagate=0

# SQLAlchemy logger
[logger_sqlalchemy]
level=WARNING
handlers=console,gcp
qualname=sqlalchemy.engine
propagate=0

# Console handler for local development and debugging
[handler_console]
class=StreamHandler
level=INFO
formatter=json
args=(sys.stdout,)

# File handler for local logging
[handler_file]
class=handlers.RotatingFileHandler
level=INFO
formatter=json
args=('/app/logs/signaai.log', 'a', 10485760, 5, 'utf-8')

# Google Cloud Logging handler
[handler_gcp]
class=google.cloud.logging.handlers.CloudLoggingHandler
level=INFO
formatter=json
args=()

# JSON formatter for structured logging
[formatter_json]
class=pythonjsonlogger.jsonlogger.JsonFormatter
format=%(asctime)s %(name)s %(levelname)s %(pathname)s %(lineno)d %(funcName)s %(process)d %(thread)d %(message)s
datefmt=%Y-%m-%d %H:%M:%S

# Standard formatter for human-readable logs
[formatter_standard]
format=%(asctime)s - %(name)s - %(levelname)s - %(pathname)s:%(lineno)d - %(funcName)s() - [PID:%(process)d TID:%(thread)d] - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
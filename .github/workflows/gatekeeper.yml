name: Gatekeeper CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  API_URL: http://localhost:5112
  OCR_SERVICE_URL: http://localhost:5113
  FRONTEND_URL: http://localhost:5114

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-cov pytest-asyncio

    - name: Run backend tests
      run: |
        cd backend
        pytest tests/ -v --cov=. --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: backend

  test-ocr-service:
    name: OCR Service Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr poppler-utils

    - name: Install Python dependencies
      run: |
        pip install -r backend/services/ocr_field_detection/requirements.txt

    - name: Start OCR service
      run: |
        cd backend/services/ocr_field_detection
        python start_ocr.py &
        sleep 5

    - name: Test OCR service
      run: |
        curl -f http://localhost:5113/
        # Add more OCR tests here

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        cd signa-app
        npm ci
        npx playwright install chromium

    - name: Run frontend tests
      run: |
        cd signa-app
        npm run build
        npm test

    - name: Run Playwright E2E tests
      run: |
        cd signa-app
        npx playwright test

  gatekeeper:
    name: Gatekeeper Integration Tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-ocr-service, test-frontend]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr poppler-utils

    - name: Install Python dependencies
      run: |
        pip install -r backend/requirements.txt
        pip install -r backend/services/ocr_field_detection/requirements.txt
        pip install playwright requests
        python -m playwright install chromium

    - name: Install frontend dependencies
      run: |
        cd signa-app
        npm ci

    - name: Start all services
      run: |
        # Start OCR service
        cd backend/services/ocr_field_detection && python start_ocr.py &

        # Start backend
        cd backend && python main.py &

        # Start frontend
        cd signa-app && npm run dev &

        # Wait for services to be ready
        sleep 10

        # Check services are running
        curl -f http://localhost:5113/ || exit 1
        curl -f http://localhost:5112/health || exit 1

    - name: Run Gatekeeper tests
      run: |
        export CI=true
        python test-e2e-comprehensive.py

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-report
        path: test-report.json

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: playwright-report
        path: signa-app/playwright-report/

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [gatekeeper]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to Production
      run: |
        echo "Deploying to production..."
        # Add your deployment steps here
        # e.g., gcloud app deploy, docker push, etc.

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Run security scan
      run: |
        # Check for exposed secrets
        if grep -r "password\|secret\|key\|token" --include="*.py" --include="*.js" --include="*.ts" . | grep -v test | grep -v ".env"; then
          echo "Potential secrets found in code!"
          exit 1
        fi

    - name: Run dependency scan
      run: |
        pip install safety
        safety check || true